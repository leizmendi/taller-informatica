<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t1="titulo.clasif">Clasificación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../fichas/fichas.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="page">
  <nav id="cabecera"></nav>
  <header>
    <div class="eyebrow" data-t="clasif.curso"></div>
    <h1 data-t="clasif.titulo"></h1>
  </header>
  <div class="fila">
    <label id="l-curso" class="oculto"><span data-t1="clasif.curso"></span> <select id="curso"></select></label>
    <label><span data-t="clasif.prueba"></span> <select id="ej"></select></label>
  </div>
  <div class="card tabla-wrap" id="tabla"></div>
  <p class="muted" data-t="clasif.nota"></p>
</main>
<script type="module">
import { sb, exigirSesion, esc, fmt } from './comun.js';
import { CLASIFICABLES, EJERCICIOS, formatoValor, nombreEj1 } from './ejercicios.js';
import { t, t1 } from './i18n.js';

const $ = id => document.getElementById(id);
const perfil = await exigirSesion();
const params = new URLSearchParams(location.search);

$('ej').innerHTML = CLASIFICABLES.map(e =>
  `<option value="${e.id}">${t1(`ficha.${e.ficha.id}`)} · ${nombreEj1(e)}</option>`).join('');
if (EJERCICIOS[params.get('ej')]?.clasifica) $('ej').value = params.get('ej');

if (perfil.rol === 'admin') {
  const { data: cursos } = await sb.from('cursos').select('id, nombre').order('creado', { ascending: false });
  $('curso').innerHTML = (cursos || []).map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('');
  if (params.get('curso')) $('curso').value = params.get('curso');
  $('l-curso').classList.remove('oculto');
}

async function cargar() {
  const ej = EJERCICIOS[$('ej').value];
  const curso = perfil.rol === 'admin' ? $('curso').value || null : null;
  if (perfil.rol === 'admin' && !curso) { $('tabla').innerHTML = `<p>${t('clasif.sinCursos')}</p>`; return; }
  if (perfil.rol !== 'admin' && !perfil.curso_id) { $('tabla').innerHTML = `<p>${t('clasif.sinCurso')}</p>`; return; }

  $('tabla').innerHTML = `<p class="muted">${t('comun.cargando')}</p>`;
  const { data, error } = await sb.rpc('clasificacion', { p_ejercicio: ej.id, p_menor_mejor: ej.menorMejor, p_curso: curso });
  if (error) { $('tabla').innerHTML = `<p class="error">${esc(error.message)}</p>`; return; }
  if (!data.length) { $('tabla').innerHTML = `<p>${t('clasif.nadie')}</p>`; return; }

  const medallas = ['🥇', '🥈', '🥉'];
  $('tabla').innerHTML = `<table class="tabla">
    <thead><tr><th>#</th><th>${t('clasif.apodo')}</th><th class="num">${t('clasif.mejor')}</th><th class="num">${t('clasif.aciertos')}</th><th class="num">${t('clasif.intentos')}</th></tr></thead>
    <tbody>${data.map((r, i) => `<tr class="${r.soy_yo ? 'yo' : ''}">
      <td>${medallas[i] ? `<span class="medalla">${medallas[i]}</span>` : i + 1}</td>
      <td>${esc(r.apodo)}</td>
      <td class="num">${formatoValor(ej, r.mejor)}</td>
      <td class="num">${r.acierto != null ? fmt(r.acierto) + ' %' : '—'}</td>
      <td class="num">${r.intentos}</td></tr>`).join('')}</tbody></table>`;
}

$('ej').onchange = cargar;
$('curso').onchange = cargar;
cargar();
</script>
</body>
</html>
